name: lemonade
summary: Lemonade desktop AI chat client
description: |
  This snap has been replaced by lemonade-desktop.

  Installing this snap will automatically install lemonade-desktop,
  which provides the full desktop chat interface for interacting with
  large language models (LLMs) running locally on your machine.

  To install the new snap directly:

    sudo snap install lemonade-desktop

version: "1.0"
grade: stable
confinement: strict
base: core24
contact: https://github.com/lemonade-sdk/lemonade-snap/issues
issues: https://github.com/lemonade-sdk/lemonade-snap/issues
website: https://github.com/lemonade-sdk/lemonade-snap

plugs:
  lemonade-server:
    interface: content
    content: lemonade-server
    target: $SNAP_DATA/lemonade-server
    default-provider: lemonade-server
  lemonade-desktop:
    interface: content
    content: lemonade-desktop
    target: $SNAP_DATA/lemonade-desktop
    default-provider: lemonade-desktop

parts:
  empty:
    plugin: nil
